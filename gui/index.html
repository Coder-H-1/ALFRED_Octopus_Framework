<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octopus Framework IDE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons for premium feel -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="vscode-dark">
    <div class="app-container">
        <!-- Activity Bar (Far Left) -->
        <nav class="activity-bar">
            <div class="top-items">
                <button class="action-btn" onclick="promptNewFunction()" title="New Function (Add)">
                    <i data-lucide="file-plus"></i>
                </button>
                <button class="action-btn" onclick="promptDeleteFunction()" title="Delete Current Function">
                    <i data-lucide="trash-2"></i>
                </button>
                <button class="action-btn" onclick="showExample()" title="Reference Example">
                    <i data-lucide="book-open"></i>
                </button>
            </div>
            <div class="bottom-items">
                <div class="status-indicator" id="main-status" title="ALFRED Status"></div>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section" id="functions-section">
                <header>FUNCTIONS (.oct)</header>
                <div class="list-wrapper">
                    <ul id="functions-list" class="file-list"></ul>
                </div>
            </div>
            
            <div class="resizer" id="sidebar-resizer"></div>

            <div class="sidebar-section" id="plugins-section">
                <header>PLUGINS (.py)</header>
                <div class="list-wrapper">
                    <ul id="plugins-list" class="file-list"></ul>
                </div>
            </div>
        </aside>

        <!-- Main Editor Area -->
        <main class="editor-area">
            <div class="editor-header">
                <div class="tab">
                    <i data-lucide="file-text" size="14"></i>
                    <span id="current-filename">Select a file</span>
                </div>
                <div class="editor-actions">
                    <button id="save-btn" class="btn primary">Save</button>
                    <button id="compile-btn" class="btn secondary hidden">Compile</button>
                </div>
            </div>
            <div class="editor-wrapper">
                <textarea id="code-editor" spellcheck="false" placeholder="// Select a file from the explorer or start typing..."></textarea>
            </div>
            
            <!-- Terminal Section -->
            <section class="terminal">
                <header>
                    <span>TERMINAL</span>
                    <button class="clear-terminal" onclick="clearTerminal()">Clear</button>
                </header>
                <div id="terminal-output" class="terminal-content">
                    Ready.
                </div>
                <div class="terminal-input-container">
                    <span class="prompt">octopus&gt;</span>
                    <input type="text" id="cli-input" placeholder="Enter CLI command...">
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="modal-title">New Function</h3>
            <p id="modal-desc">Enter function name:</p>
            <input type="text" id="modal-input">
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn primary" id="modal-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
